name: Continuous integration

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fincore_county
          MYSQL_USER: fincore_app
          MYSQL_PASSWORD: fincore_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, openssl, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-php-8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.3-
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install backend dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare local environment
        run: cp .env.example .env && php artisan key:generate
      - name: Verify MySQL migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fincore_county
          DB_USERNAME: fincore_app
          DB_PASSWORD: fincore_ci_password
        run: php artisan migrate:fresh --force
      - name: Run backend tests
        env:
          RUN_REDIS_INTEGRATION: 'true'
          RUN_MYSQL_INTEGRATION: 'true'
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fincore_county
          DB_USERNAME: fincore_app
          DB_PASSWORD: fincore_ci_password
          MYSQL_INTEGRATION_DATABASE: fincore_county
        run: php artisan test
      - name: Check PHP formatting
        run: ./vendor/bin/pint --test
      - name: Audit Composer dependencies
        run: composer audit --no-interaction

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend tests
        run: npm test -- --reporter=verbose
      - name: Build frontend
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
